    let pontuacao = 0;

    function carregarPergunta() {
        if (indiceAtual >= perguntas.length) {
            document.getElementById("quiz-container").innerHTML = `
                <h2>Fim do Quiz! 🎉</h2>
                <p style="font-size: 18px; margin: 20px 0;">Sua pontuação final: <strong>${pontuacao}</strong> de <strong>${perguntas.length}</strong></p>
                <button id="btn-proximo" style="display:block;" onclick="location.reload()">Reiniciar Quiz</button>
            `;
            return;
        }

        let q = perguntas[indiceAtual];
        document.getElementById("contador").innerText = `Pergunta ${indiceAtual + 1} de ${perguntas.length}`;
        document.getElementById("question").innerText = q.pergunta;
        document.getElementById("dica-box").innerHTML = q.dica;
        
        let opcoesArea = document.getElementById("opcoes-area");
        opcoesArea.innerHTML = "";

        q.opcoes.forEach((opcao, index) => {
            let btn = document.createElement("button");
            btn.className = "btn-opcao";
            btn.innerText = opcao;
            btn.onclick = () => verificarResposta(index);
            opcoesArea.appendChild(btn);
        });

        document.getElementById("feedback-area").innerHTML = "";
        document.getElementById("feedback-area").className = "";
        document.getElementById("btn-proximo").style.display = "none";
    }

    function verificarResposta(escolhaUsuario) {
        let q = perguntas[indiceAtual];
        let botoes = document.querySelectorAll(".btn-opcao");
        
        // Desativar todos os botões após a escolha
        botoes.forEach(b => b.disabled = true);

        let feedbackArea = document.getElementById("feedback-area");

        if (escolhaUsuario === q.correta) {
            pontuacao++;
            botoes[escolhaUsuario].style.background = "rgba(0, 255, 0, 0.3)";
            botoes[escolhaUsuario].style.borderColor = "#00FF00";
            feedbackArea.className = "feedback correto";
            feedbackArea.innerHTML = `✅ ACERTOU!<div class="detalhe-texto"><strong>Explicação:</strong> ${q.detalhe}</div>`;
        } else {
            botoes[escolhaUsuario].style.background = "rgba(255, 69, 0, 0.3)";
            botoes[escolhaUsuario].style.borderColor = "#FF4500";
            botoes[q.correta].style.background = "rgba(0, 255, 0, 0.3)";
            botoes[q.correta].style.borderColor = "#00FF00";
            
            feedbackArea.className = "feedback errado";
            feedbackArea.innerHTML = `❌ ERROU!<div class="detalhe-texto"><strong>Resposta correta:</strong> ${q.opcoes[q.correta]}<br><br><strong>Explicação:</strong> ${q.detalhe}</div>`;
        }

        document.getElementById("btn-proximo").style.display = "block";
        document.getElementById("btn-proximo").focus();
    }

    function proximaPergunta() {
        indiceAtual++;
        carregarPergunta();
    }

    carregarPergunta();
</script>

</body>
</html>
